<sly data-sly-test="${wcmmode.edit}">
	<div class="cq-placeholder" data-emptyText=" please configure Random Number component"></div>
</sly>


<div class="body">
<div class="container">
        <h1>Random Number Generator</h1>
        <div class="input-section">
            <label for="min">Minimum:</label>
            <input type="number" id="min" value="${properties.minNum}">
            <label for="max">Maximum:</label>
            <input type="number" id="max" value="${properties.maxNum}">
        </div>
        <button id="generate">${properties.generateBtn}</button>
        <div class="result">
            <p id="randomNumber">Click the button to  generate</p>
        </div>
        <button id="reset">${properties.resetBtn}</button>
</div>
</div>

<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"
     data-sly-call="${clientlib.all @ categories='myproject.components.myComponents.randomNumber'}"/>
